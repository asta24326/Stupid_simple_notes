name: CI

on:
  pull_request:
    branches: [production, dev]

jobs:
  db-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start containers
        run: docker compose up -d --build --wait

      - name: Check database responds
        run: docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "${POSTGRES_DB}" -tAc "SELECT 1"'

      - name: Check PHP connects to database
        run: docker compose exec -T php php check_db.php

      - name: Check Nginx serves static page
        run: curl -f http://localhost/ | grep "Notes App"
        # curl -f = fail: if response is 400+, then it has non zero exit code

      - name: Check GET /api/notes returns 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/notes)
          echo "status: $code"
          test "$code" = "200"
      # run: | = block of several commands in lines
      # code=$(..) = exec command inside and store inside variable "code"
      # -s = silent, no progress outpus
      # -o /dev/null = takes response's body and throw away(/dev/null)
      # -w "%{http_code}" = write-out: after requset, print status code
      # test "$code" = "200" - compare [exit code] to 200, if same = 0, or 1

      - name: Check POST /api/notes returns 201
        run: |
          code=$(curl -s -o body.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"text":"CI note"}' http://localhost/api/notes)
          cat body.json
          test "$code" = "201"
          grep -q '"text":"CI note"' body.json
      # grep -q = quiet, doesn't print, returns 0, if line is found
      # -o == --output -> means "take output and save somewhere"

      - name: Check new note appears in GET
        run: curl -s http://localhost/api/notes | grep -q '"text":"CI note"'

      - name: Check broken JSON return 400
        run: |
          code=$(curl -s -o body.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"text":"broken"' http://localhost/api/notes)
          cat body.json
          test "$code" = "400"
          grep -q '"error"' body.json

      - name: Check missing text field returns 400
        run: |
          code=$(curl -s -o body.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{}' http://localhost/api/notes)
          cat body.json
          test "$code" = "400"
          grep -q '"error"' body.json

          

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v



# Syntax
# name: CI = name of scenario in Actions folder
# on: = when to start
# pull_request, branches, [branches] = when opening where to check
# jobs = list of tasks to run
# runs-on = on which machine to run
# steps -> name = name of the step in interface
# uses = take ready action from cloud
# run = run shell command
# i f: always() = do step ALWAYS, even if previous steps failed, to clean anyway
# i f: failure() = do step only if some prev steps failed