server {
  listen 80;
  server_name localhost;
  # syntax:
  # listen 80 = to listen port 80 inside of container.
  #             it will be exposed later by Compose
  # server_name localhost= points for whch domains this block responses.
  #                        for now it's localhost, later will be domain

  root /usr/share/nginx/html;
  index index.html;
  # syntax:
  # root = directory inside container, from wher files are taken.
  # /usr/shaer/nginx/html = default dir from official image
  # index index.html = sets what file to return if folder requested
  #   request '/' is a directory, and Nginx looks in it index.html

  location / {
    try_files $uri $uri/ =404;
    # syntax:
    #   try_files           $uri $uri/ =404;
    # {command name}  {values that we pass to command}
    #
    # try_files =  command name
    # $uri = Uniform Resource Identifier
    #     https://  mysite.com  /api/notes?limit=5
    #     {schema}   {domain}   {       uri      }
    #
    # $request_uri = /api/notes?limit=5
    # $uri = /api/notes
    #
    ## URL (Uniform Resource Locator) = https://mysite.com/api/notes?limit=5
  }
  # location = rule to choose beginning of the path

  location /api/ {
    fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    # syntax:
    # fastcgi_param {NAME_FOR_PHP} ${variable from nginx}
    # { directive  }
    #
    # from request:
    # http://localhost/api/notes
    # GET /api/notes HTTP/1.1
    # Host: localhost
    # User-Agent: curl/8.x
    # Accept: */*
    #
    # $request_method   = GET
    # $request_uri      = /api/notes
    # $uri              = /api/notes
    # $query_string     = (empty, no ?)
    # $server_protocol  = HTTP/1.1
    # $remote_addr      = client's IP
    # $http_host        = localhost
    #
    # + default from Nginx
    # Host: localhost   = HTTP_HOST = localhost
    # User-AgentL curl/8.x = HTTP_USER_AGENT = curl/8.x
    # Accept: */*       = HTTP_ACCEPT = */*
    #
    # What PHP will get:
    # REQUEST_METHOD    = GET
    # REQUEST_URI       = /api/notes
    # QUERY_STRING      = 
    # SERVER_PROTOCOL   = HTTP/1.1
    # REMOTE_ADDR       = 172.x.x.x
    # SCRIPT_FILENAME   = /var/www/html/index.php
    # HTTP_HOST         = localhost
    # HTTP_USER_AGENT   = curl/8.x
    # HTTP_ACCEPT       = */*
    # (body: empty)
   
    fastcgi_pass php:9000;
    # syntax:
    # fastcgi_pass = "transfer by FastCGI protocol"
    # php - service name in docker compose net.
    # 9000 port = which PHP-FPM listens by default.
    # {fastcgi_pass} - name
    # {php:9000} - value {where}:{with what}
  }

}
